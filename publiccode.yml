  en:
    localisedName: "NEWS FLOW – Smart irrigation for urban greenery"
    shortDescription: "Data-driven irrigation planning for climate-resilient urban trees and green spaces"
    longDescription: >
      NEWS FLOW helps municipalities irrigate urban trees and green spaces according to
      actual demand while saving water and making operational decisions transparent.
      Connected soil-moisture sensors at around 200 locations combine with environmental,
      weather and plant data to provide an up-to-date picture of water availability. The
      web application analyses these data, generates irrigation recommendations and
      supports both planning and digitally assisted execution of irrigation operations.
      Artificial-intelligence and machine-learning methods are planned to add predictive
      forecasts. Fraunhofer FIT has been developing NEWS FLOW since early 2025 on behalf
      of the City of Frankfurt am Main, together with its Parks Department and Palmengarten.
    features:
      - "Demand-based irrigation using soil-moisture, environmental, weather and plant data"
      - "Data-driven irrigation recommendations and planned predictive forecasts"
      - "Planning and digitally assisted execution of irrigation operations"
      - "Optimised watering routes and more efficient workflows"
      - "Transparent data for operational control, planning and decisions"
