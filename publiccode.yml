description:
  de:
    localisedName: "NEWS FLOW – Smarte Bewässerung fürs Stadtgrün"
    shortDescription: "Datenbasierte Bewässerungsplanung für klimaresiliente Stadtbäume und Grünflächen"
    longDescription: >
      NEWS FLOW unterstützt Kommunen dabei, Stadtbäume und Grünflächen bedarfsgerecht,
      wassersparend und transparent zu bewässern. Vernetzte Bodenfeuchtesensoren an
      ca. 200 Standorten liefern zusammen mit Umwelt-, Wetter- und Pflanzendaten ein
      aktuelles Bild der Wasserverfügbarkeit. Die Webanwendung analysiert diese Daten,
      erstellt Bewässerungsempfehlungen und unterstützt sowohl die Planung als auch die
      digital begleitete Durchführung von Bewässerungseinsätzen. Perspektivisch ergänzen
      KI- und Machine-Learning-Verfahren die Anwendung um vorausschauende Prognosen.
      NEWS FLOW wird seit Anfang 2025 vom Fraunhofer FIT im Auftrag der Stadt Frankfurt
      am Main entwickelt. Kommunale Partner sind das Grünflächenamt und der Palmengarten;
      das Projekt wird durch das Hessische Ministerium für Digitalisierung und Innovation
      im Rahmen der Starke-Heimat-Förderung unterstützt.
    features:
      - "Bedarfsgerechte Bewässerung auf Basis von Bodenfeuchte-, Umwelt-, Wetter- und Pflanzendaten"
      - "Datenbasierte Bewässerungsempfehlungen und perspektivisch vorausschauende Prognosen"
      - "Planung und digital unterstützte Durchführung von Bewässerungseinsätzen"
      - "Optimierte Gießrouten und effizientere Arbeitsabläufe"
      - "Transparente Datengrundlage für Steuerung, Planung und Entscheidungen"
